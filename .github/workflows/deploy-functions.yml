name: Deploy Supabase functions

# Publishes the server-side functions (supabase/functions) to your Supabase project.
# Needs: repository secret SUPABASE_ACCESS_TOKEN, repository variable SUPABASE_PROJECT_REF.
# Manual only: needed for Pro (AI reading + Stripe webhook), not for the free app.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase functions deploy extract-receipt --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
