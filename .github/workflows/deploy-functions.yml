name: Deploy Supabase functions

# Publishes the server-side functions (supabase/functions) to your Supabase project.
# Needs: repository secret SUPABASE_ACCESS_TOKEN, repository variable SUPABASE_PROJECT_REF.
# Manual only: the app uses the free on-device reader unless RECEIPT_READER is set to "claude".
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy extract-receipt --project-ref "$PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
